<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI SubContext Review Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/app.css?v=20260731-ux-lab-3" />
  </head>
  <body class="tool-page review-page">
    <main class="shell review-shell tool-shell">
      <section class="panel review-header workspace-header">
        <div class="panel-head">
          <div>
            <div class="mini-eyebrow">Review Workspace</div>
            <h1 id="review-page-title">Subtitle Review</h1>
            <div id="review-page-meta" class="job-meta">Loading job...</div>
          </div>
          <div class="actions">
            <div id="review-sync-status" class="workspace-sync-status" role="status" aria-live="polite">Live</div>
            <a class="ghost link-button" href="/">Console</a>
            <button type="button" id="review-page-refresh" class="ghost">Refresh</button>
          </div>
        </div>
        <div class="review-toolbar">
          <div id="review-progress-card" class="review-progress-card">
            <div class="review-progress-head">
              <div id="review-progress-status"></div>
              <div id="review-progress-value" class="job-progress-value">0%</div>
            </div>
            <div class="progress"><div id="review-progress-bar" class="progress-bar" style="width:0%"></div></div>
          </div>
          <div class="review-filter-row" id="review-page-filters" role="group" aria-label="Filter subtitle lines"></div>
          <div class="review-toolbar-actions">
            <label class="review-search-box">
              <span class="sr-only">Search subtitles</span>
              <input id="review-search" type="search" placeholder="Search source, translation, status, reason, or reference" aria-keyshortcuts="/" />
              <kbd>/</kbd>
            </label>
            <button type="button" id="review-prev-flagged" class="ghost">Prev Flagged</button>
            <button type="button" id="review-next-flagged" class="ghost">Next Flagged</button>
            <button
              type="button"
              id="review-auto-rewrite-next"
              title="Retranslate all visible suspect or error lines one by one. It uses the current filter and search, and you can stop the run mid-way."
            >
              Auto Rewrite All
            </button>
          </div>
        </div>
      </section>

      <section class="review-layout">
        <section class="panel review-table-panel">
          <div class="review-table-headbar">
            <div id="review-table-summary" class="job-meta" role="status" aria-live="polite"></div>
            <div class="review-table-tools">
              <label class="review-jump-control">
                <span>Line</span>
                <input id="review-jump-line" type="number" min="1" inputmode="numeric" placeholder="#" aria-label="Jump to subtitle line" />
              </label>
              <div class="review-density-control" role="group" aria-label="Subtitle row density">
                <button type="button" data-review-density="compact" aria-pressed="false">Compact</button>
                <button type="button" data-review-density="comfortable" aria-pressed="true">Comfortable</button>
              </div>
              <details class="review-column-menu">
                <summary>Columns</summary>
                <div class="review-column-menu-body">
                  <div id="review-column-controls" class="review-column-controls"></div>
                  <button type="button" id="review-column-reset" class="ghost">Reset layout</button>
                </div>
              </details>
            </div>
          </div>
          <div class="review-table-wrap">
            <table class="review-table">
              <caption class="sr-only">Source and translated subtitle lines. Use Up and Down arrows to move between rows and Enter to open the selected line.</caption>
              <colgroup id="review-table-columns"></colgroup>
              <thead>
                <tr id="review-table-header"></tr>
              </thead>
              <tbody id="review-table-body">
                <tr><td colspan="8" class="job-meta">Loading lines...</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <aside class="panel review-side-panel" aria-label="Selected subtitle line editor">
          <div id="review-side-body" class="review-side-body">
            <p class="job-meta">Select a line to review it here.</p>
          </div>
        </aside>
      </section>
    </main>

    <div id="review-toast" class="workspace-toast" role="status" aria-live="polite" hidden></div>

    <dialog id="review-confirm-dialog" class="confirm-dialog" aria-labelledby="review-confirm-title" aria-describedby="review-confirm-message">
      <div class="dialog-form confirm-dialog-form">
        <div class="confirm-dialog-copy">
          <div class="mini-eyebrow">Please confirm</div>
          <h2 id="review-confirm-title">Confirm action</h2>
          <p id="review-confirm-message"></p>
        </div>
        <div class="actions confirm-dialog-actions">
          <button type="button" id="review-confirm-cancel" class="ghost">Cancel</button>
          <button type="button" id="review-confirm-submit" class="danger">Continue</button>
        </div>
      </div>
    </dialog>

    <dialog id="review-snapshot-dialog" aria-labelledby="review-snapshot-title">
      <form method="dialog" class="dialog-form snapshot-dialog-form">
        <div class="panel-head">
          <div>
            <div class="mini-eyebrow">Batch Card</div>
            <h2 id="review-snapshot-title">Batch Card</h2>
          </div>
          <button type="button" data-dialog-close class="ghost">Close</button>
        </div>
        <div id="review-snapshot-body" class="snapshot-dialog-body"></div>
        <div class="actions">
          <button type="button" id="review-generate-snapshot" class="ghost">Generate Card</button>
          <button type="button" id="review-save-snapshot">Save Batch Card</button>
        </div>
      </form>
    </dialog>

    <script src="/static/review.js?v=20260731-ux-lab-3"></script>
  </body>
  </html>
